         <section class="Gallery-section" id="Galeria">
            <div id="aliados-titulo">
                <h2>Aliados</h2>
                <p class="Section-tag">Herois e aliados</p>
            </div>
            <div class="gallery-grid1" id="aliados-grid">
                <figure class="gallery-item">
                    <img src="imagens/Batman.webp" alt="Batman absoluto">
                    <figcaption><strong>Batman - Bruce Wayne</strong></figcaption>
                    <div class="cardtext">
                        <h2><strong>Batman Absoluto</strong></h2>
                        <p>
                            <strong>Bruce Wayne</strong> não nasceu para ser o <strong>Batman</strong>. Nesta realidade, ele nasceu para se tornar algo muito pior para aqueles que vivem nas sombras.
Sem depender de uma fortuna, de uma mansão ou de um legado familiar, <strong>Bruce</strong> transforma sua própria dor em uma arma. Inteligência, obsessão e uma vontade inquebrável fazem dele uma criatura que Gotham aprende a temer.
O <strong>Batman</strong> Absoluto não é apenas um homem vestido de morcego. Ele é a personificação da vingança — um vigilante que conhece os monstros de Gotham porque passou a vida se preparando para enfrentá-los.
Ele não precisa de poderes para ser absoluto. Sua maior arma é a certeza de que nunca irá parar.
                        </p>
                    </div>
                </figure>

                <figure class="gallery-item">
                    <img src="imagens/JimGordon.webp" alt="Jim gordon absolut">
                    <figcaption><strong>Jim Gordon</strong></figcaption>
                    <div class="cardtext">
                        <h2><strong>Jim Gordon</strong></h2>
                        <p>
Em uma Gotham onde a corrupção se esconde atrás de distintivos, dinheiro e poder, <strong>James Gordon</strong> escolheu permanecer de pé.
Ele não é um homem perfeito, nem possui os recursos de um bilionário ou a força de um vigilante. Sua arma é outra: a determinação de fazer o que é certo, mesmo quando a cidade inteira parece estar contra ele.
<strong>Gordon</strong> conhece a escuridão de Gotham melhor do que a maioria. Ele sabe que criminosos não são o único problema — às vezes, o verdadeiro inimigo está dentro da própria polícia.
Entre a lei e o caos, <strong>Gordon</strong> se torna uma das poucas pessoas dispostas a enfrentar ambos. Para alguns, ele é apenas um policial. Para outros, é a última prova de que Gotham ainda pode ser salva.
Enquanto houver alguém disposto a lutar pela cidade, <strong>Gordon</strong> continuará na linha de frente.
                        </p>
                    </div>
                </figure>

                <figure class="gallery-item">
                    <img src="imagens/MartaWayne.webp" alt="Marta Wayne absolut">
                    <figcaption><strong>Martha Wayne</strong></figcaption>
                    <div class="cardtext">
                        <h2><strong>Martha Wayne</strong></h2>
                        <p>
                            A figura tradicional de <strong>Martha Wayne</strong> passa por uma das transformações mais chocantes de toda a história da DC Comics. Diferente da mitologia clássica, onde ela morre no Beco do Crime ao lado do marido <strong>Thomas Wayne</strong>, nesta continuidade <strong>Martha</strong> está viva. Com a morte de <strong>Thomas</strong> em um trágico tiroteio, <strong>Martha</strong> cria <strong>Bruce</strong> sozinha em meio à extrema escassez financeira de uma Gotham violenta. O grande e devastador diferencial é que <strong>Martha</strong> esconde um passado sombrio: ela foi uma letal assassina do tipo Talon e possui uma ligação direta e histórica com a Corte das Corujas. Para tentar combater a corrupção e proteger sua cidade e seu filho, ela chega a trabalhar como assistente do Prefeito <strong>Jim Gordon</strong>, mas se vê forçada a recorrer e pedir ajuda à perigosa sociedade secreta que dominava as sombras. Essa reviravolta desconstrói o pilar histórico da mãe santa e trágica do herói, colocando <strong>Martha Wayne</strong> como uma figura enigmática, politicamente estratégica e de moral ambígua no tabuleiro de Gotham.
                        </p>
                    </div>
                </figure>

                <figure class="gallery-item">
                    <img src="imagens/barbara.jpg" alt="Barbara gordon absolut">
                    <figcaption><strong>Barbara Gordon</strong></figcaption>
                    <div class="cardtext">
                        <h2><strong>Barbara Gordon</strong></h2>
                        <p>
                            <strong>Barbara Gordon</strong> deixa de lado a sua clássica persona de "Batgirl" para se transformar em A Morcega (The Bat). Sendo filha do Prefeito <strong>Jim Gordon</strong>, ela atua de dia como policial do GCPD, servindo como uma aliada que passa informações confidenciais para <strong>Bruce Wayne</strong> por fora das vias oficiais. No entanto, conforme o cenário político e criminal de Gotham escala a um nível crítico e o próprio <strong>Batman</strong> passa a perder o controle contra as ameaças da cidade, <strong>Barbara</strong> decide assumir a missão com as próprias mãos. Em vez do traje tradicional, ela adota um visual focado na urgência e no combate direto, utilizando roupas táticas inspiradas na luta livre/MMA, empunhando uma espingarda e vestindo o sobretudo de seu pai marcado com o símbolo do morcego. Com um treinamento tático de elite e uma abordagem implacável, a versão Absoluta de <strong>Barbara Gordon</strong> é retratada como uma vigilante brutal e autônoma, disposta a cruzar as linhas da lei que seu pai tenta proteger politicamente para salvar Gotham do colapso.
                        </p>
                    </div>
                </figure>

                <figure class="gallery-item">
                    <img src="imagens/ALfred.webp" alt="Alfred absolut">
                    <figcaption><strong>Alfred Pennyworth</strong></figcaption>
                    <div class="cardtext">
                        <h2><strong>Alfred Pennyworth</strong></h2>
                        <p>
                            <strong>Alfred Pennyworth</strong> passa por uma reformulação radical e abandona completamente a sua clássica persona de mordomo refinado. Nesta realidade alternativa, ele é um agente secreto britânico lendário, um mercenário calejado e veterano de operações táticas enviadas a Gotham City. Sem o casaca habitual, terno ou a mansão Wayne para cuidar, <strong>Alfred</strong> aparece usando trajes militares de combate, ostentando cicatrizes de guerra e pilotando uma motocicleta de alto desempenho. Sua chegada a Gotham ocorre em uma missão oficial do serviço secreto para investigar a proliferação da perigosa gangue dos Party Animals e neutralizar a ameaça de um novo e brutal vigilante que atua nas sombras. Sem ter qualquer vínculo prévio de criação com <strong>Bruce Wayne</strong> — já que não serviu à família nem atuou como figura paterna —, <strong>Alfred</strong> inicialmente enxerga esse <strong>Batman</strong> da classe trabalhadora como uma anomalia extremamente perigosa. No entanto, ao observar de perto a ferocidade de <strong>Bruce</strong> e sua dedicação obstinada à causa sem o auxílio de bilhões de dólares, o espião desenvolve um profundo respeito pelo herói, tornando-se uma espécie de consultor tático, aliado letal e observador estratégico nas ruas de uma Gotham inteiramente tomada pelo caos.
                        </p>
                    </div>
                </figure>
            </div>

            <div id="viloes-titulo">
                <h2>Vilões</h2>
                <p class="Section-tag">Vilões e antagonistas</p>
            </div>
            <div class="gallery-grid1" id="viloes-grid">
                <figure class="gallery-item">
                    <img src="imagens/BlackMask.jpg" alt="Black mask absolut">
                    <figcaption><strong>Máscara Negra</strong></figcaption>
                    <div class="cardtext">
                        <h2><strong>Máscara Negra</strong></h2>
                        <p>
                            o <strong>Máscara Negra</strong> (<strong>Black Mask</strong>) deixa de ser um mero chefe da máfia convencional para se tornar o principal antagonista do primeiro arco da revista, intitulado "The Zoo" ("O Zoológico"). Nesta versão, ele lidera a letal e niilista gangue dos Party Animals, um grupo paramilitar e anárquico superarmado que espalha o caos e promove massacres coordenados por Gotham. O <strong>Máscara Negra</strong> opera como uma força desestabilizadora contratada e financiada por elites corporativas para semear o terror na cidade e executar alvos políticos de alto escalão — incluindo o próprio Prefeito <strong>Jim Gordon</strong>. Esteticamente e na atitude, ele é retratado de forma extremamente brutal e grotesca, comandando ataques com armamento pesado e servindo como o primeiro grande teste para o <strong>Batman</strong> da classe trabalhadora, que precisa enfrentá-lo sem a ajuda de supertecnologias ou bilhões de dólares.   O personagem faz sua primeira aparição logo em Absolute <strong>Batman</strong> #1 (lançada em outubro de 2024), onde seus Party Animals promovem um massacre e introduzem o clima visceral da nova série. Ele é a ameaça central do quadrinho durante todo o primeiro arco, que se estende de Absolute <strong>Batman</strong> #1 a #6 (publicados entre outubro de 2024 e março de 2025). A trama se desenrola em locais marcantes da cidade, culminando em um grande confronto contra o <strong>Batman</strong> e as forças da cidade nas ruas de Gotham City e no centro financeiro da metrópole, onde o vilão tenta consolidar seu domínio através do medo antes de a história abrir espaço para ameaças ainda maiores.
                        </p>
                    </div>
                </figure>

                <figure class="gallery-item">
                    <img src="imagens/coringa.jpeg" alt="Coringa absolut">
                    <figcaption><strong>Coringa</strong></figcaption>
                    <div class="cardtext">
                        <h2><strong>Coringa</strong></h2>
                        <p>
                            o <strong>Coringa</strong> (Absolute <strong>Joker</strong>) passa pela inversão mais radical de sua história: em um mundo onde os heróis não possuem privilégios, ele herdou toda a fortuna, o treinamento global e a influência que pertenceriam ao <strong>Bruce Wayne</strong> tradicional. O vilão é retratado como um homem de negócios bilionário, imensamente poderoso, frio e sem empatia, fruto de uma "dinastia" imobiliária e corporativa de Gotham. Longe de ser um palhaço anárquico ou louco, ele é um sociopata metódico que enxerga o mundo como sua propriedade privada. Fisicamente aterrorizante, ele se submete a bizarras modificações diárias e carrega a capacidade secreta de se transformar em uma criatura monstruosa e dracônica, operando como o verdadeiro governante invisível das sombras que financia o caos na cidade.   Sua primeira aparição acontece logo em uma breve cena dramática ao final de Absolute <strong>Batman</strong> #1 (lançada em outubro de 2024), onde sua presença é sugerida como a força sombria e o financiador por trás dos massacres de Gotham. Conforme o primeiro arco se desenrola, o personagem vai sendo revelado nas sombras, até ter sua origem secular, segredos dinásticos e verdadeira forma monstruosa completamente desvendados em Absolute <strong>Batman</strong> #15. Ele atua como a ameaça definitiva da série, representando o ápice do sistema opressor contra o qual o <strong>Batman</strong> operário precisa lutar.
                        </p>
                            
                </figure>

                <figure class="gallery-item">
                    <img src="imagens/Deathstroke.webp" alt="Exterminador absolut">
                    <figcaption><strong>Exterminador (Slade Wilson)</strong></figcaption>
                    <div class="cardtext">
                        <h2><strong>Exterminador</strong></h2>
                        <p>
                            o <strong>Exterminador</strong> (<strong>Deathstroke</strong> / <strong>Slade Wilson</strong>) passa por uma releitura reformulada, abandonando o papel de mero assassino de aluguel para se tornar um líder paramilitar cibernejetado e extremamente letal a serviço do <strong>Coringa</strong> e de suas corporações.
Nesta realidade, <strong>Slade Wilson</strong> é um ciborgue fortemente armado e de porte tático, modificado pelo procedimento do veneno/Venom que o <strong>Coringa</strong> utiliza para criar supersoldados. Além disso, <strong>Slade</strong> possui um forte apelo emocional na trama devido ao seu passado: ele era um antigo "irmão de armas" e companheiro de operações de <strong>Alfred Pennyworth</strong>. Enquanto <strong>Alfred</strong> seguiu um caminho próprio ao chegar a Gotham, <strong>Slade</strong> aliou-se ao império do <strong>Coringa</strong> (J.K. Holdings) e passou a liderar o "Programa Robin" — uma força governamental e paramilitar que utiliza jovens e mechs para impor o controle militar na cidade sob o pretexto de manter a ordem. Ele enxerga <strong>Batman</strong> como um terrorista que precisa ser erradicado e assume a posição de segurança pessoal dos executivos do <strong>Coringa</strong>. <br>
<br>
Primeira Mensão / Teaser Teórico: As primeiras pistas sobre a existência de <strong>Slade</strong> e sua ligação passada com <strong>Alfred</strong> surgem durante o primeiro ano da revista (em diálogos e teasers visuais por volta de Absolute <strong>Batman</strong> #9).   Revelação e Estreia Oficial: A introdução completa e o papel definitivo do <strong>Exterminador</strong> no Universo Absoluto acontecem no especial Absolute <strong>Batman</strong>: Ark M Special #1 e na edição Absolute <strong>Batman</strong> #19, lançadas no início de 2026.
                        </p>
                    </div>
                </figure>

                <figure class="gallery-item">
                    <img src="imagens/espantalho.jpg" alt="Espantalho absolut">
                    <figcaption><strong>Espantalho</strong></figcaption>
                    <div class="cardtext">
                        <h2><strong>Espantalho</strong></h2>
                        <p>
                            o <strong>Espantalho</strong> (<strong>Scarecrow</strong> / Dr. <strong>Jonathan Crane</strong>) abandona o tradicional terno esfarrapado e a máscara de palha para se transformar em uma figura metódica, fria e aterrorizante da elite corporativa da cidade. Cientista e operador das instalações da Ark M, ele trabalha a serviço do império do <strong>Coringa</strong> (J.K. Holdings) como um gênio da manipulação psicológica, guerra química e desinformação. A grande peculiaridade macabra deste personagem é a sua própria face: longe de ser apenas um capuz de pano, seu rosto possui costuras e pontos escuros costurados na pele humana, criando uma fisionomia bizarra e grotesca. Ele veste ternos elegantes e caminha descalço, acompanhado por um bando de corvos sob seu controle tático. Em vez de apenas pulverizar toxinas em grandes multidões, o <strong>Espantalho</strong> Absoluto é um "agente do desespero" que utiliza deepfakes, tortura psicológica extrema e manipulação química precisa para induzir suicídios, assassinar alvos políticos e devastar a mente de seus inimigos — inclusive fazendo <strong>Bruce</strong> acreditar que toda a sua vida e tragédia foram orquestradas como uma piada do sistema.
                            <br>
                            <br>
                            Estreia Oficial: O personagem fez sua aguardada e chocante estreia em Absolute <strong>Batman</strong> #19 (lançada em abril de 2026), que deu início ao arco principal da série intitulado "The Straw Man" ("O Homem de Palha").
                        </p>
                    </div>
                </figure>

                <figure class="gallery-item">
                    <img src="imagens/HeraVenenosa.jpg" alt="HeraVenenosa absolut">
                    <figcaption><strong>Hera Venenosa (Pamela Isley)</strong></figcaption>
                    <div class="cardtext">
                        <h2><strong>Hera Venenosa</strong></h2>
                        <p>
                            No universo de <strong>Batman</strong> Absoluto (Absolute <strong>Batman</strong>), escrito por Scott Snyder e desenhado por Eric Canete e Nick Dragotta, a <strong>Hera Venenosa</strong> (<strong>Poison Ivy</strong> / Dra. <strong>Pamela Isley</strong>) passa de uma vilã focada no reino vegetal para uma das ameaças mais aterrorizantes e cientificamente monstruosas do Universo Absoluto.Em sua nova origem, <strong>Pamela Isley</strong> era uma jovem e brilhante cientista que iniciou suas pesquisas motivada pelo desespero de encontrar a cura para uma doença fatal de sua mãe. Em vez de focar apenas na flora, <strong>Pamela</strong> concluiu que para salvar a humanidade era preciso fundir geneticamente as células humanas com todos os reinos da vida (vegetal, animal, fúngico e bacteriano). No entanto, após ser traída por executivos e aprisionada nas instalações macabras do complexo Ark M, um incêndio catastrófico destruiu seu laboratório. Mutada e consumida pelas células engenheiradas que criou, ela sobreviveu fundida ao seu próprio ecossistema biológico.   Ao contrário da versão clássica, que apenas controla plantas, a <strong>Hera Venenosa</strong> Absoluta é a Avatar de Todos os Reinos da Biologia. Ela tem o poder da biocinese total, sendo capaz de gerar ecossistemas mutantes, controlar mentes e invocar projeções e clones humanóides idênticos à sua aparência original para enganar seus alvos. Quando sua ilusão se desfaz, revela-se sua verdadeira forma: um pesadelo biomecânico e biológico ao estilo horror corporal (body horror), uma criatura monstruosa repleta de olhos, dentes e membros mutantes capazes de assimilar qualquer matéria viva.
                            <br>
                            <br>
                            Estreia Oficial: A personagem faz sua introdução completa em Absolute <strong>Batman</strong> #17 (lançada em fevereiro de 2026), dentro do arco focado na sua revanche contra as corporações e a cidade.
                        </p>
                    </div>
                </figure>
                <figure class="gallery-item">
                    <img src="imagens/bane.jpg" alt="Bane absolut">
                    <figcaption><strong>Bane</strong></figcaption>
                    <div class="cardtext">
                        <h2><strong>Bane</strong></h2>
                        <p>
                            o <strong>Bane</strong> (Absolute <strong>Bane</strong>) passa por uma reformulação colossal que o eleva ao topo das ameaças físicas e geopolíticas da DC. Como este <strong>Batman</strong> da classe operária já é um homem gigantesco de mais de 100 kg, os autores desenharam o <strong>Bane</strong> para ser uma força verdadeiramente monstruosa, dwarfando o próprio <strong>Bruce Wayne</strong> em tamanho e presença física.   Longe de ser apenas um mercenário de prisão sul-americana, o <strong>Bane</strong> Absoluto opera como um executor de elite global e braço direito do <strong>Coringa</strong> (J.K. Holdings). Ele é apresentado como um homem articulado, calmo e de tom filosófico, mas com uma crueldade avassaladora. Ele não busca apenas destruir o <strong>Batman</strong> fisicamente em combate, mas sim quebrar seu espírito desmantelando sistematicamente a vida das pessoas ao redor do herói. Na trama, <strong>Bane</strong> executa missões geopolíticas internacionais para desestabilizar governos a mando de elites financeiras e atua como o catalisador que sistematicamente tortura e deforma os amigos de infância de <strong>Bruce</strong> — como <strong>Oswald Cobblepot</strong>, <strong>Harvey Dent</strong> e <strong>Edward Nygma</strong> —, forçando-os a evoluírem nas versões sombrias que o destino reservava para eles (<strong>Pinguim</strong>, <strong>Duas-Caras</strong> e <strong>Charada</strong>). 
                            <br>
                            <br>
                            Primeira Aparição: O personagem faz sua estreia oficial e impactante no fechamento de Absolute <strong>Batman</strong> #9 (lançada em junho de 2025), onde derrota o <strong>Batman</strong> em seu primeiro confronto direto.   Origem Revelada: Sua história e passado como principal executor do império do <strong>Coringa</strong> são detalhados na edição dedicada Absolute <strong>Batman</strong> #11 (lançada em agosto de 2025).
                        </P>
                    </div>
                </figure>

                <figure class="gallery-item">
                    <img src="imagens/Catwoman.jpg" alt="Mulher gato absolut">
                    <figcaption><strong>Mulher-Gato (Selina Kyle)</strong></figcaption>
                    <div class="cardtext">
                        <h2><strong>Mulher-Gato</strong></h2>
                        <p>
                            A <strong>Mulher-Gato</strong> (<strong>Catwoman</strong> / <strong>Selina Kyle</strong>) passa por uma grande inversão de papéis em comparação com o Cavaleiro das Trevas. Enquanto <strong>Bruce Wayne</strong> é retratado como um vigilante da classe operária sem grandes recursos tecnológicos, <strong>Selina Kyle</strong> é uma espiã de elite, mestre dos assaltos e "maga da alta tecnologia" (high-tech wizard). Autossuficiente, perspicaz e extremamente rica devido aos seus golpes audaciosos pelo mundo, ela opera a partir de um amparado esconderijo de alta tecnologia (a "Cat Cave") e veste trajes táticos avançados construídos por ela mesma. Longe de ser apenas uma ladra de joias ou uma figura de moral ambígua do submundo, a <strong>Selina</strong> do Universo Absoluto atua como uma predadora de topo (apex predator) que usa seus imensos recursos, ganchos cibernejetados, drones e redes de espionagem para desmantelar alvos corporativos corruptos e sindicatos do crime global.
                            <br>
                            <br>
                            Primeira Aparição: <strong>Selina</strong> surge inicialmente como uma personagem recorrente de apoio logo nos primeiros arcos de Absolute <strong>Batman</strong>, servindo de contraponto financeiro e tecnológico ao <strong>Bruce Wayne</strong>. <strong> Título Próprio (Absolute Catwoman): </strong> Devido à grande receptividade dos leitores, a DC lançou em junho de 2026 a minissérie própria Absolute <strong>Catwoman</strong> #1 (escrita por Che Grayson e Scott Snyder).
                            </p>
                    </div>
                </figure>

                <figure class="gallery-item">
                    <img src="imagens/SenhorFrio.jpg" alt="Senhor frio absolut">
                    <figcaption><strong>Senhor Frio (Victor Fries)</strong></figcaption>
                    <div class="cardtext">
                        <h2><strong>Senhor Frio</strong></h2>
                        <p>
                            No universo de <strong>Batman</strong> Absoluto (Absolute <strong>Batman</strong>), escrito por Scott Snyder e com arte de Nick Dragotta e Marcos Martín, o <strong>Senhor Frio</strong> (<strong>Mr. Freeze</strong> / <strong>Victor Fries Jr.</strong>) passa por uma das reinterpretações mais macabras e visceralmente aterrorizantes de toda a história da DC Comics.Nesta realidade, ele abandona a clássica e trágica busca pela cura de sua esposa <strong>Nora</strong> e o terno de contenção robótico tradicional. Em seu lugar, <strong>Victor Fries Jr.</strong> é o CEO da megalópole tecnológica V-Core e herdeiro de glaciologistas obcecados. Quando jovem, <strong>Victor</strong> desenvolveu uma doença terminal e foi colocado em criossono por seus pais; contudo, ele permaneceu consciente durante todo o processo congelado, sentindo uma dor excruciante e incessante que acabou destruindo sua sanidade. O gelo que preservava seu corpo continha uma bactéria mutagênica pré-histórica que alterou sua biologia e o transformou em uma monstruosidade viva.   Sem a necessidade de um traje mecânico, seu corpo opera naturalmente em temperaturas congelantes. Ele possui uma fisiologia pálida e deformada (inspirada na figura do Nosferatu e de um Wendigo), com tecidos musculares petrificados, garras capazes de congelar qualquer superfície ou pessoa ao toque e a habilidade de absorver o calor do ambiente ao seu redor. <strong>Victor Fries</strong> encara a dor e o congelamento como uma "graça e purificação" divina, e sua missão é submeter Gotham e toda a humanidade a esse mesmo tormento criogênico eterno.
                            <br>
                            <br>
                            Estreia Oficial: O personagem fez sua primeira aparição e teve sua origem macabra revelada em Absolute <strong>Batman</strong> #7 (lançada em abril de 2025), ilustrada pelo artista convidado Marcos Martín.
                        </p>
                    </div>
                </figure>
